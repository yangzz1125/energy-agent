[project]
name = "energy-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.26.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
